[package]
name = "pixiechess-client"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Unofficial async Rust client for the PixieChess API"
repository = "https://github.com/pixiechess-analytics/pixiechess-client-rs"
readme = "README.md"
keywords = ["pixiechess", "api-client", "async"]
categories = ["api-bindings", "web-programming::http-client"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[dependencies]
async-stream = "0.3"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
